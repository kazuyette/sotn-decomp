options:
  platform: psx
  basename: bobo7
  base_path: ..
  build_path: build/us
  target_path: disks/us/BOSS/BO7/BO7.BIN
  asm_path: asm/us/boss/bo7
  asset_path: assets/boss/bo7
  src_path: src/boss/bo7
  ld_script_path: build/us/bobo7.ld
  compiler: GCC
  symbol_addrs_path:
    - config/symbols.us.txt
    - config/symbols.us.bobo7.txt
  undefined_funcs_auto_path: build/us/config/undefined_funcs_auto.us.bobo7.txt
  undefined_syms_auto_path: build/us/config/undefined_syms_auto.us.bobo7.txt
  find_file_boundaries: true
  use_legacy_include_asm: false
  migrate_rodata_to_functions: true
  asm_jtbl_label_macro: jlabel
  symbol_name_format: us_$VRAM
  disassemble_all: true
  section_order:
    - .data
    - .rodata
    - .text
    - .bss
    - .sbss
  ld_bss_is_noload: false
  disasm_unknown: true
  global_vram_start: 0x80010000
segments:
  - name: bobo7
    type: code
    start: 0x0
    vram: 0x80180000
    align: 4
    subalign: 4
    subsegments:
      - [0x0, data]  # TODO: boss-specific, not yet identified (0x1309c bytes)
      - [0x1309C, c, e_lock_camera]
      # Cerberus-specific behavior code (confirmed via `jr $ra` scan: 14 real
      # function returns found here, vs. 0 in the head/tail `data` gaps).
      - [0x13258, c]
      - [0x16648, c, st_update]
      - [0x16A7C, c, st_collision]
      - [0x18238, c, create_entity]
      - [0x18DB0, c, e_red_door]
      - [0x19A60, c, st_common]
      - [0x1AF10, c, e_collect]
      - [0x1D874, c, e_misc]
      - [0x1FC10, c, e_particles]
      - [0x20454, c, e_stage_name]
      - [0x212A8, c, e_room_fg]
      - [0x21394, c, popup]
      - [0x216C4, c, prim_helpers]
      - [0x21EF4, c, e_life_up]
      - [0x227A8, data]  # TODO: boss-specific, not yet identified (0xcb8 bytes, tail)
  - [0x23460]
