options:
  platform: psx
  basename: stdre
  base_path: ..
  build_path: build/hd
  target_path: disks/pspeu/PSP_GAME/USRDIR/res/ps/hdbin/dre.bin
  asm_path: asm/hd/st/dre
  asset_path: assets/st/dre
  src_path: src/st/dre
  ld_script_path: build/hd/stdre.ld
  compiler: GCC
  symbol_addrs_path:
    - config/symbols.hd.txt
    - config/symbols.hd.stdre.txt
  undefined_funcs_auto_path: build/hd/config/undefined_funcs_auto.hd.stdre.txt
  undefined_syms_auto_path: build/hd/config/undefined_syms_auto.hd.stdre.txt
  find_file_boundaries: true
  use_legacy_include_asm: false
  migrate_rodata_to_functions: true
  asm_jtbl_label_macro: jlabel
  symbol_name_format: hd_$VRAM
  section_order:
    - .data
    - .rodata
    - .text
    - .bss
    - .sbss
  ld_bss_is_noload: false
  disasm_unknown: true
  disassemble_all: true
  global_vram_start: 0x80010000
sha1: 60a233f9945023443904c66e68a64932f8726ba6
segments:
  - name: stdre
    type: code
    start: 0
    vram:  0x80180000
    align: 4
    subalign: 4
    subsegments:
      - [0x0, data]
      - [0x113C8, .rodata, hd]
      - [0x11684, c, hd]
      - [0x2252C, sbss]
  - [0x23290]
