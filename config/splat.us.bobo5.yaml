options:
  platform: psx
  basename: bobo5
  base_path: ..
  build_path: build/us
  target_path: disks/us/BOSS/BO5/BO5.BIN
  asm_path: asm/us/boss/bo5
  asset_path: assets/boss/bo5
  src_path: src/boss/bo5
  ld_script_path: build/us/bobo5.ld
  compiler: GCC
  symbol_addrs_path:
    - config/symbols.us.txt
    - config/symbols.us.bobo5.txt
  undefined_funcs_auto_path: build/us/config/undefined_funcs_auto.us.bobo5.txt
  undefined_syms_auto_path: build/us/config/undefined_syms_auto.us.bobo5.txt
  find_file_boundaries: true
  use_legacy_include_asm: false
  migrate_rodata_to_functions: true
  asm_jtbl_label_macro: jlabel
  symbol_name_format: us_$VRAM
  disassemble_all: true
  section_order:
    - .data
    - .rodata
    - .text
    - .bss
    - .sbss
  ld_bss_is_noload: false
  disasm_unknown: true
  global_vram_start: 0x80010000
segments:
  - name: bobo5
    type: code
    start: 0x0
    vram: 0x80180000
    align: 4
    subalign: 4
    subsegments:
      - [0x0, data]  # TODO: boss-specific, not yet identified (0x1faac bytes)
      - [0x1FAAC, c, e_room_bg]
      - [0x1FB74, c, e_lock_camera]
      # Hippogryph-specific behavior code (confirmed via `jr $ra` scan: 37 real
      # function returns found here, vs. 0 in the head/tail `data` gaps).
      - [0x1FD30, c]
      - [0x26BB4, c, st_update]
      - [0x26FE8, c, st_collision]
      - [0x287A4, c, create_entity]
      - [0x2931C, c, e_red_door]
      - [0x29FCC, c, st_common]
      - [0x2B47C, c, e_collect]
      - [0x2DDE0, c, e_misc]
      - [0x3017C, c, e_stage_name]
      - [0x30FD0, c, e_particles]
      - [0x31814, c, e_room_fg]
      - [0x31900, c, popup]
      - [0x31C30, c, prim_helpers]
      - [0x32460, c, e_life_up]
      - [0x32D14, data]  # TODO: boss-specific, not yet identified (0x291c bytes, tail)
  - [0x35630]
